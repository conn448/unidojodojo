name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          # vite build (SPA mode) emits the publishable site to dist/client.
          if [ -d dist/client ]; then
            echo "Using dist/client"
            static_dir=dist/client
          elif [ -d dist ]; then
            echo "Using dist"
            static_dir=dist
          elif [ -d .output/public ]; then
            echo "Using .output/public"
            static_dir=.output/public
          else
            echo "No static build directory was produced (dist/client, dist or .output/public)."
            exit 1
          fi
          mkdir -p pages-artifact
          cp -R "$static_dir"/. pages-artifact/
          if [ ! -f pages-artifact/index.html ]; then
            echo "The build produced no index.html; check the SPA prerender in vite.config.ts."
            exit 1
          fi
          # Preserve client-side routes when served by GitHub Pages.
          cp pages-artifact/index.html pages-artifact/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
